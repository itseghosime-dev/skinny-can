name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Formatting Check
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit Tests
        run: npm run test

      - name: Production Build
        run: npm run build
        env:
          FRESHDESK_DOMAIN: mock-domain
          FRESHDESK_API_KEY: mock-key
          NEXT_PUBLIC_SITE_URL: https://skinny-cans.com
